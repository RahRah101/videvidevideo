[project]
name = "videvidevideo"
version = "0.1.0"
description = "CLI-native long-form video production pipeline"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "elevenlabs",
    "requests",
    "anthropic",
    "opentimelineio",
]

[project.scripts]
vvv = "vvv.cli:main"

# Plugins: importing the package registers its directives / producers / sources / assemblers.
# Third-party plugins declare the same group in their own package. Rerun `pip install -e .` after edits.
[project.entry-points."vvv.plugins"]
pause = "vvv.plugins.producers.pause"
narrate = "vvv.plugins.producers.elevenlabs_narrate"
clip = "vvv.plugins.producers.clip"
title = "vvv.plugins.producers.title"
stem = "vvv.plugins.producers.stems"
image_url = "vvv.plugins.sources.image_url"
ytdlp = "vvv.plugins.sources.ytdlp"
kdencli = "vvv.plugins.assemblers.kdencli"

# Backends, loaded lazily by name from the script's config (only the selected one is imported).
[project.entry-points."vvv.tts_backends"]
elevenlabs = "vvv.plugins.producers.elevenlabs_narrate.elevenlabs_impl:ElevenLabsTTS"

[project.entry-points."vvv.stem_backends"]
demucs = "vvv.plugins.producers.stems.demucs_backend:LocalDemucs"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
